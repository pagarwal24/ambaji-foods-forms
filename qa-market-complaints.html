<script>
const QA_CLOUD_URL="https://script.google.com/macros/s/AKfycbyi8DlI-5tHZUy8wOW35CJFpH65bsDU6Vx-H_ceNsGl5RzjvXAprYmWHXbB4G31PDw0/exec";
const QA_APPROVAL_PAGE="https://pagarwal24.github.io/ambaji-foods-forms/approval.html";
const QA_APPROVAL_MOBILES={production:"919838654270",parle:"919795500700"};
let qaPendingRecord=null;
function qaToken(){const bytes=new Uint8Array(18);crypto.getRandomValues(bytes);return Array.from(bytes,b=>b.toString(16).padStart(2,"0")).join("")}
function qaSlug(value){return String(value||"qa-check").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")}
function qaActiveForm(){return document.querySelector(".form.active")}
function qaFormData(form){
  const values={},rows=[];
  form.querySelectorAll("input,select,textarea").forEach(control=>{if(control.dataset.k)values[control.dataset.k]=control.value});
  form.querySelectorAll("tbody tr").forEach((row,index)=>{
    rows.push({
      time:row.querySelector(".row-clock")?.value||"",
      machine:row.children[1]?.querySelector("input")?.value||row.children[1]?.textContent.trim()||"",
      checkPoint:row.children[2]?.querySelector("input")?.value||row.children[2]?.textContent.replace("Added point","").trim()||"",
      standard:row.children[3]?.querySelector("input")?.value||row.children[3]?.textContent.trim()||"",
      result:row.children[4]?.querySelector("input")?.value||"",
      status:row.children[5]?.querySelector("select")?.value||"",
      action:row.children[6]?.querySelector("input")?.value||"",
      sign:row.children[7]?.querySelector("input")?.value||"",
      row:index+1
    })
  });
  return {section:form.dataset.section,...values,checkResults:rows}
}
function qaPost(params){return fetch(QA_CLOUD_URL,{method:"POST",mode:"no-cors",body:new URLSearchParams(params)})}
function qaBase64(blob){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result).split(",")[1]);reader.onerror=reject;reader.readAsDataURL(blob)})}
function qaApprovalCode(record,role,decision){
  const payload={id:record.id,role,decision,token:record.data.approvals[role].token,doc:record.docId,title:record.data.section+" QA Check"};
  return btoa(JSON.stringify(payload)).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/g,"")
}
function qaShowApprovalButtons(record){
  qaPendingRecord=record;
  document.getElementById("qaApprovalOne").style.display="inline-flex";
  document.getElementById("qaApprovalTwo").style.display="inline-flex"
}
function sendQaApproval(role){
  if(!qaPendingRecord){alert("Save the record before sending approval.");return}
  const record=qaPendingRecord,results=record.data.checkResults||[];
  const failed=results.filter(item=>item.status==="Fail").map(item=>item.checkPoint).filter(Boolean);
  const hold=results.filter(item=>item.status==="Hold").map(item=>item.checkPoint).filter(Boolean);
  const text=`*Ambaji Foods — QA Check For Market Complaints*\nSection: ${record.data.section}\nDate: ${record.data.date||"—"}\nShift: ${record.data.shift||"—"}\nProduct: ${record.data.product||"—"}\n\n*Findings*\nFailed: ${failed.join(", ")||"None"}\nHold: ${hold.join(", ")||"None"}\nRemarks: ${record.data.remarks||"—"}\n\n✅ *APPROVE*\n${QA_APPROVAL_PAGE}?a=${encodeURIComponent(qaApprovalCode(record,role,"approved"))}\n\n❌ *REJECT*\n${QA_APPROVAL_PAGE}?a=${encodeURIComponent(qaApprovalCode(record,role,"rejected"))}\n\nApps By Prateek Agarwal`;
  window.open(`https://wa.me/${QA_APPROVAL_MOBILES[role]}?text=${encodeURIComponent(text)}`,"_blank","noopener")
}
window.save=async function(){
  const form=qaActiveForm();if(!form)return;
  const status=document.getElementById("qaDriveStatus");
  const data=qaFormData(form),now=new Date().toISOString();
  data.approvals={production:{status:"pending",token:qaToken()},parle:{status:"pending",token:qaToken()}};
  data.approvalStatus="pending";
  const record={id:crypto.randomUUID?crypto.randomUUID():Date.now().toString(36),formId:"qa-market-complaints-"+qaSlug(form.dataset.section),docId:"AFPL/QA/MKT/"+qaSlug(form.dataset.section).toUpperCase(),data,createdAt:now,updatedAt:now};
  status.textContent="Saving to Google Drive…";
  try{
    const local={__custom:[...form.querySelectorAll("[data-custom]")].map(x=>x.dataset.custom)};
    form.querySelectorAll("input,select,textarea").forEach(control=>{if(control.dataset.k)local[control.dataset.k]=control.value});
    localStorage.setItem(k(form),JSON.stringify(local));
    await qaPost({action:"upsert",record:JSON.stringify(record)});
    const image=await buildReportImage(form);
    await qaPost({action:"upload",recordId:record.id,fileName:"PENDING_Ambaji_Foods_"+qaSlug(form.dataset.section)+"_"+new Date().toISOString().slice(0,10)+".jpg",mimeType:"image/jpeg",base64:await qaBase64(image)});
    qaShowApprovalButtons(record);
    status.textContent="Saved · Pending digital approval";
    alert("Saved to Google Drive. Send Approval 1 and Approval 2.")
  }catch(error){
    status.textContent="Browser backup saved";
    alert("Browser backup saved. Google Drive could not be reached.")
  }
};
</script></body></html>
